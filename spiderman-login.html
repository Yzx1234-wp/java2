<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蜘蛛侠 · 蛛网登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --red: #e23636;
    --red-dark: #b71c1c;
    --blue: #1565c0;
    --blue-dark: #0d2b54;
    --web: rgba(255,255,255,.10);
    --ink: #f3f5fb;
    --muted: #aab4c8;
  }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(circle at 20% 20%, rgba(226,54,54,.25), transparent 45%),
      radial-gradient(circle at 80% 80%, rgba(21,101,192,.30), transparent 45%),
      #0a0f1e;
    color: var(--ink);
    overflow: hidden;
    position: relative;
  }
  /* spider web background */
  .webs { position: fixed; inset: 0; pointer-events: none; opacity: .5; }
  .webs::before, .webs::after {
    content: ""; position: absolute; width: 520px; height: 520px;
    background-image:
      repeating-conic-gradient(from 0deg at 0 0, transparent 0 14deg, var(--web) 14deg 15deg);
    -webkit-mask: radial-gradient(circle at 0 0, #000 60%, transparent 72%);
            mask: radial-gradient(circle at 0 0, #000 60%, transparent 72%);
  }
  .webs::before { top: -160px; left: -160px; }
  .webs::after { bottom: -160px; right: -160px; transform: rotate(180deg); }

  .card {
    width: 860px; max-width: 94vw; min-height: 540px;
    background: rgba(13,20,38,.78);
    backdrop-filter: blur(10px);
    border: 1.5px solid rgba(226,54,54,.45);
    border-radius: 20px;
    box-shadow: 0 24px 70px rgba(0,0,0,.55);
    display: flex; overflow: hidden; position: relative; z-index: 1;
  }
  /* left hero */
  .hero {
    flex: 1; position: relative; padding: 46px 38px;
    background:
      radial-gradient(circle at 30% 30%, rgba(226,54,54,.35), transparent 50%),
      linear-gradient(155deg, #1b3a6b 0%, #0d2b54 60%, #07101f 100%);
    display: flex; flex-direction: column; justify-content: space-between;
    overflow: hidden;
  }
  .hero .web-lines { position: absolute; inset: 0; opacity: .35;
    background-image: repeating-conic-gradient(from 0deg at 50% 120%, transparent 0 11deg, rgba(255,255,255,.18) 11deg 12deg);
    -webkit-mask: radial-gradient(circle at 50% 120%, #000 55%, transparent 70%);
            mask: radial-gradient(circle at 50% 120%, #000 55%, transparent 70%);
  }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 21px; z-index: 1; }
  .brand .emblem { width: 40px; height: 40px; }
  .hero h1 { font-size: 32px; line-height: 1.35; margin-top: 46px; z-index: 1; font-weight: 800;
    text-shadow: 0 2px 14px rgba(0,0,0,.5); }
  .hero h1 span { color: var(--red); }
  .hero p { margin-top: 14px; font-size: 14px; color: var(--muted); line-height: 1.7; z-index: 1; }
  .tags { margin-top: auto; display: flex; flex-direction: column; gap: 13px; z-index: 1; }
  .tag { display: flex; align-items: center; gap: 11px; font-size: 14px; color: #d8deea; }
  .tag .dot { width: 28px; height: 28px; border-radius: 50%; background: rgba(226,54,54,.25);
    border: 1px solid rgba(226,54,54,.5); display: grid; place-items: center; font-size: 13px; }

  /* right form */
  .form { flex: 1; padding: 46px 42px; display: flex; flex-direction: column; justify-content: center; }
  .form h2 { font-size: 23px; }
  .form .sub { color: var(--muted); font-size: 14px; margin-bottom: 26px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 7px; }
  .input {
    width: 100%; height: 46px; border: 1.5px solid rgba(255,255,255,.16); border-radius: 11px;
    padding: 0 14px; display: flex; align-items: center; background: rgba(255,255,255,.04);
    transition: .2s;
  }
  .input input { flex: 1; border: none; outline: none; font-size: 15px; background: transparent; color: var(--ink); }
  .input input::placeholder { color: #6f7c93; }
  .input:focus-within { border-color: var(--red); box-shadow: 0 0 0 4px rgba(226,54,54,.18); }
  .input .eye { cursor: pointer; color: var(--muted); font-size: 13px; user-select: none; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 22px; font-size: 13px; }
  .row label { display: flex; align-items: center; gap: 7px; color: var(--muted); cursor: pointer; }
  .row a { color: var(--red); text-decoration: none; }
  .row a:hover { text-decoration: underline; }
  .btn {
    width: 100%; height: 48px; border: none; border-radius: 11px; cursor: pointer;
    background: linear-gradient(135deg, #ff4b4b, #e23636);
    color: #fff; font-size: 16px; font-weight: 700; letter-spacing: 2px; transition: .2s;
    box-shadow: 0 10px 24px rgba(226,54,54,.35);
  }
  .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; margin: 22px 0; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,.14); }
  .social { display: flex; gap: 12px; }
  .social button {
    flex: 1; height: 44px; border: 1.5px solid rgba(255,255,255,.16); border-radius: 11px;
    background: rgba(255,255,255,.04); cursor: pointer; font-size: 14px; color: var(--ink);
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .social button:hover { border-color: var(--red); }
  .signup { text-align: center; margin-top: 22px; font-size: 14px; color: var(--muted); }
  .signup a { color: var(--red); text-decoration: none; font-weight: 600; }
  .hint { color: #ff8a80; font-size: 12px; margin-top: 6px; display: none; }
  .err { border-color: #ff5252 !important; }
  @media (max-width: 760px) { .card { flex-direction: column; } .hero { display: none; } }
</style>
</head>
<body>
  <div class="webs"></div>
  <div class="card">
    <aside class="hero">
      <div class="web-lines"></div>
      <div class="brand">
        <svg class="emblem" viewBox="0 0 100 100" fill="none">
          <circle cx="50" cy="50" r="46" fill="#0d2b54" stroke="#e23636" stroke-width="5"/>
          <path d="M50 18c10 8 10 22 0 32-10-10-10-24 0-32z" fill="#e23636"/>
          <path d="M18 50c8 10 22 10 32 0-10-10-24-10-32 0z" fill="#e23636"/>
          <path d="M50 82c-10-8-10-22 0-32 10 10 10 24 0 32z" fill="#e23636"/>
          <path d="M82 50c-8-10-22-10-32 0 10 10 24 10 32 0z" fill="#e23636"/>
        </svg>
        蛛网账号
      </div>
      <div>
        <h1>你的<span>超能力</span><br>从登录开始</h1>
        <p>跨越维度，连接你的专属英雄世界。登录后即可同步装备、追踪任务、解锁限定徽章。</p>
      </div>
      <div class="tags">
        <div class="tag"><span class="dot">🕸️</span> 蛛丝加密 · 账户安全</div>
        <div class="tag"><span class="dot">⚡</span> 极速登录 · 一键穿越</div>
        <div class="tag"><span class="dot">🦸</span> 英雄专属 · 限定特权</div>
      </div>
    </aside>

    <section class="form">
      <h2>蛛网登录</h2>
      <div class="sub">还没有英雄身份？<a href="#">立即觉醒</a></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="account">英雄代号 / 邮箱</label>
          <div class="input">
            <input type="text" id="account" placeholder="请输入代号或邮箱" autocomplete="username">
          </div>
          <div class="hint" id="accountHint">请输入有效的代号或邮箱</div>
        </div>

        <div class="field">
          <label for="pwd">密钥口令</label>
          <div class="input">
            <input type="password" id="pwd" placeholder="请输入口令" autocomplete="current-password">
            <span class="eye" id="toggle">显示</span>
          </div>
          <div class="hint" id="pwdHint">口令不能为空</div>
        </div>

        <div class="row">
          <label><input type="checkbox" id="remember"> 记住英雄身份</label>
          <a href="#">忘记口令？</a>
        </div>

        <button class="btn" type="submit">成 为 蜘 蛛 侠</button>

        <div class="divider">其他方式穿越</div>
        <div class="social">
          <button type="button">📱 短信穿越</button>
          <button type="button">🕷️ 蛛网令牌</button>
        </div>

        <div class="signup">新英雄？<a href="#">免费觉醒身份</a></div>
      </form>
    </section>
  </div>

<script>
  const form = document.getElementById('loginForm');
  const account = document.getElementById('account');
  const pwd = document.getElementById('pwd');
  const toggle = document.getElementById('toggle');
  const accountHint = document.getElementById('accountHint');
  const pwdHint = document.getElementById('pwdHint');

  toggle.addEventListener('click', () => {
    const show = pwd.type === 'password';
    pwd.type = show ? 'text' : 'password';
    toggle.textContent = show ? '隐藏' : '显示';
  });

  function validAccount(v) {
    const phone = /^1[3-9]\d{9}$/;
    const email = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return phone.test(v) || email.test(v);
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    let ok = true;
    account.closest('.input').classList.remove('err');
    pwd.closest('.input').classList.remove('err');
    accountHint.style.display = 'none';
    pwdHint.style.display = 'none';

    if (!validAccount(account.value.trim())) {
      account.closest('.input').classList.add('err');
      accountHint.style.display = 'block';
      ok = false;
    }
    if (pwd.value.length === 0) {
      pwd.closest('.input').classList.add('err');
      pwdHint.style.display = 'block';
      ok = false;
    }
    if (!ok) return;

    const btn = form.querySelector('.btn');
    const txt = btn.textContent;
    btn.textContent = '穿越中…';
    btn.disabled = true;
    setTimeout(() => {
      alert('登录成功！欢迎回到英雄世界 🕸️\n（演示页面，未连接后端）');
      btn.textContent = txt;
      btn.disabled = false;
    }, 700);
  });
</script>
</body>
</html>
