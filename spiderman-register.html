<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蜘蛛侠 · 觉醒身份</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --red: #e23636;
    --red-dark: #b71c1c;
    --blue: #1565c0;
    --blue-dark: #0d2b54;
    --web: rgba(255,255,255,.10);
    --ink: #f3f5fb;
    --muted: #aab4c8;
  }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(circle at 20% 20%, rgba(226,54,54,.25), transparent 45%),
      radial-gradient(circle at 80% 80%, rgba(21,101,192,.30), transparent 45%),
      #0a0f1e;
    color: var(--ink);
    overflow: hidden;
    position: relative;
  }
  .webs { position: fixed; inset: 0; pointer-events: none; opacity: .5; }
  .webs::before, .webs::after {
    content: ""; position: absolute; width: 520px; height: 520px;
    background-image:
      repeating-conic-gradient(from 0deg at 0 0, transparent 0 14deg, var(--web) 14deg 15deg);
    -webkit-mask: radial-gradient(circle at 0 0, #000 60%, transparent 72%);
            mask: radial-gradient(circle at 0 0, #000 60%, transparent 72%);
  }
  .webs::before { top: -160px; left: -160px; }
  .webs::after { bottom: -160px; right: -160px; transform: rotate(180deg); }

  .card {
    width: 860px; max-width: 94vw; min-height: 560px;
    background: rgba(13,20,38,.78);
    backdrop-filter: blur(10px);
    border: 1.5px solid rgba(226,54,54,.45);
    border-radius: 20px;
    box-shadow: 0 24px 70px rgba(0,0,0,.55);
    display: flex; overflow: hidden; position: relative; z-index: 1;
  }
  .hero {
    flex: 1; position: relative; padding: 46px 38px;
    background:
      radial-gradient(circle at 30% 30%, rgba(226,54,54,.35), transparent 50%),
      linear-gradient(155deg, #1b3a6b 0%, #0d2b54 60%, #07101f 100%);
    display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
  }
  .hero .web-lines { position: absolute; inset: 0; opacity: .35;
    background-image: repeating-conic-gradient(from 0deg at 50% 120%, transparent 0 11deg, rgba(255,255,255,.18) 11deg 12deg);
    -webkit-mask: radial-gradient(circle at 50% 120%, #000 55%, transparent 70%);
            mask: radial-gradient(circle at 50% 120%, #000 55%, transparent 70%);
  }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 21px; z-index: 1; }
  .brand .emblem { width: 40px; height: 40px; }
  .hero h1 { font-size: 30px; line-height: 1.35; margin-top: 30px; z-index: 1; font-weight: 800; text-shadow: 0 2px 14px rgba(0,0,0,.5); }
  .hero h1 span { color: var(--red); }
  .hero p { margin-top: 14px; font-size: 14px; color: var(--muted); line-height: 1.7; z-index: 1; }
  .tags { margin-top: auto; display: flex; flex-direction: column; gap: 13px; z-index: 1; }
  .tag { display: flex; align-items: center; gap: 11px; font-size: 14px; color: #d8deea; }
  .tag .dot { width: 28px; height: 28px; border-radius: 50%; background: rgba(226,54,54,.25); border: 1px solid rgba(226,54,54,.5); display: grid; place-items: center; font-size: 13px; }

  .form { flex: 1; padding: 40px 42px; display: flex; flex-direction: column; justify-content: center; overflow-y: auto; }
  .form h2 { font-size: 23px; }
  .form .sub { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 7px; }
  .input {
    width: 100%; height: 44px; border: 1.5px solid rgba(255,255,255,.16); border-radius: 11px;
    padding: 0 14px; display: flex; align-items: center; background: rgba(255,255,255,.04); transition: .2s;
  }
  .input input { flex: 1; border: none; outline: none; font-size: 15px; background: transparent; color: var(--ink); }
  .input input::placeholder { color: #6f7c93; }
  .input:focus-within { border-color: var(--red); box-shadow: 0 0 0 4px rgba(226,54,54,.18); }
  .input .eye { cursor: pointer; color: var(--muted); font-size: 13px; user-select: none; }
  .row { display: flex; align-items: center; gap: 8px; margin: 4px 0 20px; font-size: 13px; color: var(--muted); }
  .row a { color: var(--red); text-decoration: none; }
  .row a:hover { text-decoration: underline; }
  .btn {
    width: 100%; height: 48px; border: none; border-radius: 11px; cursor: pointer;
    background: linear-gradient(135deg, #ff4b4b, #e23636);
    color: #fff; font-size: 16px; font-weight: 700; letter-spacing: 2px; transition: .2s;
    box-shadow: 0 10px 24px rgba(226,54,54,.35);
  }
  .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; margin: 20px 0; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,.14); }
  .social { display: flex; gap: 12px; }
  .social button {
    flex: 1; height: 44px; border: 1.5px solid rgba(255,255,255,.16); border-radius: 11px;
    background: rgba(255,255,255,.04); cursor: pointer; font-size: 14px; color: var(--ink);
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .social button:hover { border-color: var(--red); }
  .login-link { text-align: center; margin-top: 20px; font-size: 14px; color: var(--muted); }
  .login-link a { color: var(--red); text-decoration: none; font-weight: 600; }
  .hint { color: #ff8a80; font-size: 12px; margin-top: 6px; display: none; }
  .err { border-color: #ff5252 !important; }
  @media (max-width: 760px) { .card { flex-direction: column; } .hero { display: none; } }
</style>
</head>
<body>
  <div class="webs"></div>
  <div class="card">
    <aside class="hero">
      <div class="web-lines"></div>
      <div class="brand">
        <svg class="emblem" viewBox="0 0 100 100" fill="none">
          <circle cx="50" cy="50" r="46" fill="#0d2b54" stroke="#e23636" stroke-width="5"/>
          <path d="M50 18c10 8 10 22 0 32-10-10-10-24 0-32z" fill="#e23636"/>
          <path d="M18 50c8 10 22 10 32 0-10-10-24-10-32 0z" fill="#e23636"/>
          <path d="M50 82c-10-8-10-22 0-32 10 10 10 24 0 32z" fill="#e23636"/>
          <path d="M82 50c-8-10-22-10-32 0 10 10 24 10 32 0z" fill="#e23636"/>
        </svg>
        蛛网账号
      </div>
      <div>
        <h1>觉醒你的<br><span>英雄身份</span></h1>
        <p>加入蛛网联盟，跨越维度守护城市。创建身份即可同步装备、领取新手徽章。</p>
      </div>
      <div class="tags">
        <div class="tag"><span class="dot">🕸️</span> 三步觉醒 · 即刻出发</div>
        <div class="tag"><span class="dot">⚡</span> 蛛丝加密 · 隐私守护</div>
        <div class="tag"><span class="dot">🦸</span> 限定徽章 · 专属特权</div>
      </div>
    </aside>

    <section class="form">
      <h2>觉醒身份</h2>
      <div class="sub">已有英雄身份？<a href="spiderman-login.html">前往登录</a></div>

      <form id="regForm" novalidate>
        <div class="field">
          <label for="account">英雄代号 / 邮箱</label>
          <div class="input"><input type="text" id="account" placeholder="用于登录的代号或邮箱" autocomplete="username"></div>
          <div class="hint" id="accountHint">请输入有效的代号或邮箱</div>
        </div>

        <div class="field">
          <label for="pwd">设置口令</label>
          <div class="input">
            <input type="password" id="pwd" placeholder="至少 6 位" autocomplete="new-password">
            <span class="eye" id="toggle1">显示</span>
          </div>
          <div class="hint" id="pwdHint">口令至少 6 位</div>
        </div>

        <div class="field">
          <label for="pwd2">确认口令</label>
          <div class="input">
            <input type="password" id="pwd2" placeholder="再次输入口令" autocomplete="new-password">
            <span class="eye" id="toggle2">显示</span>
          </div>
          <div class="hint" id="pwd2Hint">两次输入的口令不一致</div>
        </div>

        <div class="row">
          <input type="checkbox" id="agree">
          <label for="agree">我已阅读并同意 <a href="#">《英雄守则》</a></label>
        </div>
        <div class="hint" id="agreeHint">请先同意英雄守则</div>

        <button class="btn" type="submit">觉 醒 身 份</button>

        <div class="divider">其他方式觉醒</div>
        <div class="social">
          <button type="button">📱 短信觉醒</button>
          <button type="button">🕷️ 蛛网令牌</button>
        </div>

        <div class="login-link">已是英雄？<a href="spiderman-login.html">返回登录</a></div>
      </form>
    </section>
  </div>

<script>
  const form = document.getElementById('regForm');
  const account = document.getElementById('account');
  const pwd = document.getElementById('pwd');
  const pwd2 = document.getElementById('pwd2');
  const agree = document.getElementById('agree');
  const h = { a: document.getElementById('accountHint'), p: document.getElementById('pwdHint'), p2: document.getElementById('pwd2Hint'), g: document.getElementById('agreeHint') };

  function show(el, box, on) { el.style.display = on ? 'block' : 'none'; box.closest('.input')?.classList.toggle('err', on); }
  function validAccount(v) { return /^1[3-9]\d{9}$/.test(v) || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

  function bindEye(t, inp) {
    t.addEventListener('click', () => { const s = inp.type === 'password'; inp.type = s ? 'text' : 'password'; t.textContent = s ? '隐藏' : '显示'; });
  }
  bindEye(document.getElementById('toggle1'), pwd);
  bindEye(document.getElementById('toggle2'), pwd2);

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    let ok = true;
    [h.a, h.p, h.p2, h.g].forEach(x => x.style.display = 'none');
    document.querySelectorAll('.input').forEach(x => x.classList.remove('err'));

    if (!validAccount(account.value.trim())) { show(h.a, account, true); ok = false; }
    if (pwd.value.length < 6) { show(h.p, pwd, true); ok = false; }
    if (pwd2.value !== pwd.value || pwd2.value === '') { show(h.p2, pwd2, true); ok = false; }
    if (!agree.checked) { h.g.style.display = 'block'; ok = false; }
    if (!ok) return;

    const btn = form.querySelector('.btn');
    const txt = btn.textContent;
    btn.textContent = '觉醒中…'; btn.disabled = true;
    setTimeout(() => { alert('身份觉醒成功！欢迎加入蛛网联盟 🕸️\n（演示页面，未连接后端）'); btn.textContent = txt; btn.disabled = false; }, 700);
  });
</script>
</body>
</html>
